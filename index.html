<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Una sorpresa speciale per Zaira</title>
  <meta name="description" content="Un piccolo viaggio nei nostri ricordi, creato con tutto il mio amore. Apri quando sarà il momento 💖">
  <meta name="theme-color" content="#3d0d4f">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="it_IT">
  <meta property="og:url" content="https://mauroleolakyy.github.io/regalozaira/index.html">
  <meta property="og:title" content="Una sorpresa speciale per Zaira">
  <meta property="og:description" content="Un piccolo viaggio nei nostri ricordi, creato con tutto il mio amore. Apri quando sarà il momento 💖">
  <meta property="og:image" content="https://mauroleolakyy.github.io/regalozaira/assets/img/IMG%20(1).png">
  <meta property="og:image:secure_url" content="https://mauroleolakyy.github.io/regalozaira/assets/img/IMG%20(1).png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:alt" content="Zaira e Mauro insieme">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Una sorpresa speciale per Zaira">
  <meta name="twitter:description" content="Un piccolo viaggio nei nostri ricordi, creato con tutto il mio amore. Apri quando sarà il momento 💖">
  <meta name="twitter:image" content="https://mauroleolakyy.github.io/regalozaira/assets/img/IMG%20(1).png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=DM+Sans:wght@400;500&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="locked" style="background-color:#5e0f3d">

  <div id="countdown" role="region" aria-labelledby="countdownTitle">
    <div class="countdown-card">
      <p class="countdown-kicker">Una sorpresa speciale</p>
      <h1 id="countdownTitle">Ci siamo quasi!</h1>
      <p id="countdownDate"></p>
      <div class="countdown-clock" aria-label="Tempo rimanente">
        <div><b data-countdown="days">0</b><span>giorni</span></div>
        <div><b data-countdown="hours">00</b><span>ore</span></div>
        <div><b data-countdown="minutes">00</b><span>minuti</span></div>
        <div><b data-countdown="seconds">00</b><span>secondi</span></div>
      </div>
      <section id="countdownReveals" aria-labelledby="countdownRevealTitle">
        <p id="countdownRevealTitle">Una piccola lettera al giorno</p>
        <p id="countdownRevealTimerLabel">La prossima busta si apre tra</p>
        <p id="countdownRevealTimer" aria-label="Tempo alla prossima rivelazione">00:00:00</p>
        <button id="countdownEnvelope" type="button" disabled aria-expanded="false">
          <span aria-hidden="true">✉</span>
          <span id="countdownEnvelopeLabel">La prima busta si apre a mezzanotte</span>
        </button>
        <p id="countdownRevealText" aria-live="polite" hidden></p>
      </section>
      <p id="countdownError" hidden></p>
    </div>
  </div>

  <!-- Schermata password -->
  <div id="lock" hidden>
    <svg class="drip" id="lockDrip" viewBox="0 0 1200 170" preserveAspectRatio="none" aria-hidden="true"></svg>
    <form id="lockForm" autocomplete="off">
      <h1>Per Zaira</h1>
      <p id="lockText"></p>
      <ul id="clues"></ul>
      <p id="found" aria-live="polite"></p>
      <section id="codePuzzle" hidden aria-labelledby="codePrompt" aria-live="polite">
        <p id="codePrompt">Tocca i frammenti nell’ordine richiesto.</p>
        <ol id="codeSlots" aria-label="Codice ricomposto"></ol>
        <div id="codeFragments"></div>
        <button id="resetCode" type="button">Ricomincia ordine</button>
      </section>
      <input id="pw" type="text" inputmode="numeric" aria-label="Parola magica" placeholder="Completa il gioco per sbloccare" required disabled>
      <button id="openButton" type="submit" disabled>Apri</button>
      <p id="err" role="alert"></p>
    </form>
  </div>

  <!-- Caricamento dopo la password giusta -->
  <div id="loader" hidden role="status" aria-live="polite">
    <div class="ld">
      <svg class="blob" viewBox="0 0 140 110" aria-hidden="true">
        <ellipse cx="70" cy="62" rx="58" ry="44" fill="#ffd1e8"/><ellipse cx="42" cy="38" rx="14" ry="7" fill="#fff" opacity=".7"/>
        <g fill="#5a1038"><circle cx="52" cy="62" r="5"/><circle cx="88" cy="62" r="5"/></g>
        <ellipse cx="36" cy="72" rx="8" ry="5" fill="#ff5a8a" opacity=".6"/><ellipse cx="104" cy="72" rx="8" ry="5" fill="#ff5a8a" opacity=".6"/>
        <path d="M62 72q8 9 16 0" stroke="#5a1038" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      </svg>
      <p id="ldMsg"></p>
      <div class="ldbar"><i id="ldFill"></i></div>
      <b id="ldPct">0%</b>
    </div>
  </div>

  <div id="bar" aria-hidden="true"></div>
  <div id="stage" aria-hidden="true" hidden></div>
  <div id="age" aria-hidden="true">0</div>
  <div id="app"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <!-- Musica: il pulsante compare solo se in data.js c'è una canzone -->
  <button id="music" type="button" hidden aria-label="Musica">♪</button>
  <div id="musicPanel" hidden></div>
  <button id="sfx" type="button" aria-label="Disattiva i suoni" aria-pressed="true">🔊</button>

  <script src="data.js"></script>
  <script src="assets/js/sfx.js"></script>
  <script src="assets/js/countdown.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
